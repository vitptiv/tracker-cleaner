<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<title>Tracker Cleaner: the report</title>
<style>
  :root { --bg:#fff; --text:#15181d; --muted:#6b717a; --line:#dfe2e6; --bad:#c9372c; color-scheme:light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d0f12; --text:#e6e8eb; --muted:#8a8f98; --line:#262a30; --bad:#ff6b5e; color-scheme:dark; } }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:12px 14px; } h1 { font-size:16px; margin:0 0 6px; } h2 { font-size:14px; margin:16px 0 4px; }
  p { margin:6px 0; } .m { color:var(--muted); font-size:12px; } .c { border-top:1px solid var(--line); padding:6px 0; word-break:break-word; }
  .h { display:flex; justify-content:space-between; align-items:baseline; gap:8px; } .h > span { text-align:right; } .b { display:flex; flex-wrap:wrap; gap:6px; margin:4px 0; }
  button { font:inherit; font-size:12px; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--text); padding:2px 8px; cursor:pointer; }
  button.go { color:var(--bad); } button.small { font-size:11px; padding:1px 6px; color:var(--muted); } button:disabled { opacity:.5; cursor:default; }
  code { font-size:12px; word-break:break-all; } label { cursor:pointer; } summary { cursor:pointer; padding:2px 0; } details .c { padding-left:12px; }
  #note { position:sticky; top:0; background:var(--bg); z-index:1; min-height:16px; padding:2px 0; }
</style></head>
<body><main>
  <h1>Tracker Cleaner</h1>
  <p id="note" class="m"></p>
  <div id="out"><p class="m">Loading…</p></div>
</main><script src="lists.js"></script><script src="core.js"></script><script src="history.js"></script><script src="report-view.js"></script><script src="report-page.js"></script></body></html>
