<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<title>Tracker Cleaner</title>
<style>
  :root { --bg:#fff; --text:#15181d; --muted:#8a8f98; --line:#dfe2e6; --ok:#1f9d5c; --bad:#c9372c; --link:#2f6fd6; color-scheme:light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d0f12; --text:#e6e8eb; --muted:#6b717a; --line:#262a30; --ok:#3dd68c; --bad:#ff6b5e; --link:#7fb0ff; color-scheme:dark; } }
  body { margin:0; width:320px; max-height:560px; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,sans-serif; }
  main { padding:12px 14px; } h1 { font-size:15px; margin:0 0 6px; } h2 { font-size:13px; margin:12px 0 4px; }
  p { margin:4px 0; } .m { color:var(--muted); font-size:12px; } .ok { color:var(--ok); } .bad { color:var(--bad); }
  .c { border-top:1px solid var(--line); padding:6px 0; word-break:break-word; } a { color:var(--link); text-decoration:none; }
  .h { display:flex; justify-content:space-between; align-items:center; gap:8px; } .sub { padding-left:8px; font-size:12px; }
  button { font:inherit; font-size:12px; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--text); padding:2px 8px; cursor:pointer; flex:0 0 auto; }
  button.drop { color:var(--bad); } button.warn { background:var(--bad); color:#fff; } button.perm, button.allow { color:var(--link); }
  button.all { width:100%; margin:6px 0; padding:6px; background:var(--bad); color:#fff; border:0; font-weight:600; } button:disabled { opacity:.5; }
  .gone b, .gone span:first-child { text-decoration:line-through; opacity:.6; }
  #note { position:sticky; top:0; background:var(--bg); z-index:1; padding:2px 0;  font-size:12px; min-height:16px; margin:0 0 4px; }
  .b { display:flex; flex-wrap:wrap; gap:6px; margin:4px 0; } button.go { color:var(--bad); } button.small { font-size:11px; padding:1px 6px; color:var(--muted); }
  select { font:inherit; font-size:12px; } label { cursor:pointer; } .h > span { min-width:0; }
  details { border-top:1px solid var(--line); padding:6px 0; } summary { cursor:pointer; padding:2px 0; } details .c { padding-left:12px; font-size:13px; }
</style></head>
<body><main>
  <h1>Tracker Cleaner</h1>
  <p><a href="history.html" target="_blank">See everything and its history</a></p>
  <p id="note" class="m"></p>
  <div id="out"><p class="m">Loading…</p></div>
</main><script src="popup-audit.js"></script><script src="history.js"></script><script src="popup-view.js"></script><script src="popup.js"></script></body></html>
